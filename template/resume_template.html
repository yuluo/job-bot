<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Layout Skeleton</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --rule: #1a1a1a;
    --placeholder: #8a8a8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 11pt;
    line-height: 1.4;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    max-width: 8.5in;
    min-height: 11in;
    margin: 24px auto;
    padding: 0.6in;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12);
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 18px;
  }

  .name {
    font-size: 20pt;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
  }

  .contact-line {
    font-size: 10.5pt;
    margin: 2px 0;
    color: var(--muted);
  }

  .placeholder {
    color: var(--placeholder);
    border-bottom: 1px dashed #bcbcbc;
    padding: 0 4px;
    font-style: normal;
  }

  /* ---------- Sections ---------- */
  section { margin-bottom: 16px; }

  .section-title {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1.5px solid var(--rule);
    padding-bottom: 2px;
    margin: 0 0 8px;
  }

  /* ---------- Skills ---------- */
  .skill-row { margin: 3px 0; }
  .skill-label { font-weight: bold; }

  /* ---------- Experience / Education entries ---------- */
  .entry { margin-bottom: 14px; break-inside: avoid; page-break-inside: avoid; }

  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .entry-org { font-weight: bold; }
  .entry-loc { font-weight: bold; white-space: nowrap; }
  .entry-role { font-style: italic; }
  .entry-dates { font-style: italic; white-space: nowrap; }

  ul.bullets {
    margin: 6px 0 0;
    padding-left: 20px;
  }

  ul.bullets li { margin: 4px 0; }

  .edu-detail { margin: 2px 0; }

  /* ---------- Print ---------- */
  @page {
    size: letter;
    margin: 0.6in;
  }

  @media print {
    html, body { background: #fff; font-size: 10.5pt; }
    .page {
      margin: 0;
      padding: 0;
      max-width: none;
      min-height: 0;
      box-shadow: none;
    }
    .placeholder { border-bottom-color: #999; }
  }
</style>
</head>
<body>
  <!--
    Layout skeleton only. This file supplies the print CSS above and the class
    vocabulary below; it carries no real resume content by design.

    /setup copies the <style> block verbatim and fills this structure with the
    candidate's own resume, writing candidate/resume_template.html.
    Repeat or drop .entry blocks and sections to match the real resume.
  -->
  <div class="page">

    <header>
      <div class="name"><span class="placeholder">[ NAME ]</span></div>
      <div class="contact-line"><span class="placeholder">[ LOCATION ]</span></div>
      <div class="contact-line"><span class="placeholder">[ CONTACT ]</span></div>
    </header>

    <section>
      <h2 class="section-title">Skills</h2>
      <div class="skill-row"><span class="skill-label">[ Group ]:</span> <span class="placeholder">[ comma-separated skills ]</span></div>
    </section>

    <section>
      <h2 class="section-title">Experience</h2>

      <div class="entry">
        <div class="entry-row">
          <span class="entry-org"><span class="placeholder">[ Employer ]</span></span>
          <span class="entry-loc"><span class="placeholder">[ Location ]</span></span>
        </div>
        <div class="entry-row">
          <span class="entry-role"><span class="placeholder">[ Job title ]</span></span>
          <span class="entry-dates"><span class="placeholder">[ MM/YYYY&ndash;MM/YYYY ]</span></span>
        </div>
        <ul class="bullets">
          <li><span class="placeholder">[ Accomplishment bullet ]</span></li>
        </ul>
      </div>
    </section>

    <section>
      <h2 class="section-title">Education Background</h2>
      <div class="entry">
        <div class="entry-row">
          <span class="entry-org"><span class="placeholder">[ Institution ]</span></span>
          <span class="entry-dates"><span class="placeholder">[ Mon YYYY &ndash; Mon YYYY ]</span></span>
        </div>
        <div class="edu-detail"><span class="placeholder">[ Degree and field ]</span></div>
      </div>
    </section>

  </div>
</body>
</html>
